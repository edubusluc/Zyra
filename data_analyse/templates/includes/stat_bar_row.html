{% load i18n l10n %}
{# Fila de barra del diseño (nombre con «i», barra y %). Recibe label, hint y r (dict de set_stats con pct; None sin datos). #}
<div class="st-bar-row"><b>{{ label }}<button type="button" class="z-tip" data-tip="{{ hint }}" aria-label="{{ hint }}" aria-expanded="false"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button></b><div class="st-meter"><span style="width: {{ r.pct|default:0|unlocalize }}%"></span></div><em>{% if r.pct is None %}—{% else %}{{ r.pct }}%{% endif %}</em></div>
