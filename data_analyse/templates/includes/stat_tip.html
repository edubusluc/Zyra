{% load i18n %}{# «i» con la explicación de una métrica cuya regla no es evidente. Recibe tip (texto). Las notas descriptivas no van visibles en las tarjetas. #}
<button type="button" class="z-tip" data-tip="{{ tip }}" aria-label="{{ tip }}" aria-expanded="false"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button>
