name: Documentación

# Construye la web de documentación (mkdocs.yml) en cada pull request y la publica en
# GitHub Pages en cada push a main. Requiere Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Sin caché: este workflow publica en Pages y una caché envenenada acabaría en la web.
          python-version: "3.11"

      - name: Instalar MkDocs
        run: pip install --only-binary ':all:' --require-hashes -r requirements-docs.txt

      - name: Todo el código tiene docstring
        run: python scripts/check_docstrings.py

      - name: El índice para asistentes está al día
        run: python scripts/check_ai_docs.py

      - name: Construir la web
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
