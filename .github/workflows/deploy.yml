name: Imagen y despliegue

# En los PR solo se construye la imagen y se comprueba que Chromium arranca (no se publica nada).
# En main se publica la imagen en GHCR. El despliegue por SSH está apagado hasta que exista el
# servidor: se activa con la variable de repositorio DEPLOY_ENABLED=true (docs/despliegue.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/zyra
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir (en PR no se publica)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comprobar Chromium y la configuración de producción
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/zyra:sha-${{ github.sha }}
        run: |
          IMAGE="$(echo "$IMAGE" | tr 'A-Z' 'a-z')"
          docker run --rm "$IMAGE" python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()"
          docker run --rm -e DJANGO_DEBUG=False -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
            -e FIELD_ENCRYPTION_KEY="$(docker run --rm "$IMAGE" python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
            -e DJANGO_ALLOWED_HOSTS=ejemplo.com -e ADMIN_URL=panel-prueba/ \
            -e DJANGO_BEHIND_PROXY=True -e SITE_URL=https://ejemplo.com \
            "$IMAGE" python manage.py check --deploy --fail-level ERROR

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar por SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "zyra@$HOST" "/opt/zyra/deploy.sh $SHA"
