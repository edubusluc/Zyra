name: Imagen y despliegue

# Se construyen dos imágenes: zyra (web, sin navegador) y zyra-scheduler (lanzador, con Chromium).
# En los PR solo se construyen y se comprueba que Chromium arranca (no se publica nada).
# En main se pasan los tests (tests.yml), se publican las imágenes en GHCR y, si DEPLOY_ENABLED=true,
# se despliega por SSH solo cuando los tests y las imágenes han ido bien (docs/despliegue.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/zyra
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - id: meta_scheduler
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/zyra-scheduler
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir la web (en PR no se publica)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: web
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Construir el lanzador (en PR no se publica)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: scheduler
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_scheduler.outputs.tags }}
          cache-from: type=gha,scope=scheduler
          cache-to: type=gha,mode=max,scope=scheduler
      - name: Comprobar Chromium (lanzador) y la configuración de producción (web)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/zyra:sha-${{ github.sha }}
          SCHEDULER_IMAGE: ghcr.io/${{ github.repository_owner }}/zyra-scheduler:sha-${{ github.sha }}
        run: |
          IMAGE="$(echo "$IMAGE" | tr 'A-Z' 'a-z')"
          SCHEDULER_IMAGE="$(echo "$SCHEDULER_IMAGE" | tr 'A-Z' 'a-z')"
          docker run --rm "$SCHEDULER_IMAGE" python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()"
          if docker run --rm "$IMAGE" ls /ms-playwright 2>/dev/null | grep -q .; then
            echo "La imagen web no debe llevar Chromium" >&2; exit 1
          fi
          docker run --rm -e DJANGO_DEBUG=False -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
            -e FIELD_ENCRYPTION_KEY="$(docker run --rm "$IMAGE" python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
            -e DJANGO_ALLOWED_HOSTS=ejemplo.com -e ADMIN_URL=panel-prueba/ -e EMAIL_HOST_PASSWORD=contrasena-de-prueba \
            -e DJANGO_BEHIND_PROXY=True -e SITE_URL=https://ejemplo.com \
            "$IMAGE" python manage.py check --deploy --fail-level ERROR

  # Los tests en main: el despliegue espera a que pasen (en los PR ya los lanza tests.yml).
  tests:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [image, tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar por SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          # DEPLOY_SSH_KEY puede ser la llave en texto (con BEGIN/END) o en base64 de una sola línea.
          install -m 600 /dev/null key
          case "$KEY" in
            *BEGIN*) printf '%s\n' "$KEY" | tr -d '\r' > key ;;
            *) printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > key ;;
          esac
          ssh-keygen -y -f key > /dev/null
          # La huella del servidor va fijada (secreto DEPLOY_KNOWN_HOSTS): si cambia, el despliegue falla en vez de fiarse.
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "Falta el secreto DEPLOY_KNOWN_HOSTS (salida de: ssh-keyscan -t ed25519 IP_DEL_SERVIDOR)" >&2; exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$HOST" "/opt/zyra/deploy.sh $SHA"
