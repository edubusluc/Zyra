{% load i18n %}
{# Formulario de cerrar convocatoria; con card=True el botón es una tarjeta de acción. #}
<form action="{% url 'close_call' match.public_id %}" method="post" data-loading-text="{% translate 'Cerrando la convocatoria…' %}"
              data-confirm-title="{% translate 'Cerrar la convocatoria' %}" data-confirm-action="{% translate 'Cerrar y enviar' %}"{% if finals_call_short %} data-confirm-check="{% translate 'Convocarlos igualmente (la organización lo ha autorizado)' %}" data-confirm-check-name="force_finals"{% elif report_already_sent %} data-confirm-check="{% translate 'Volver a enviar el informe' %}" data-confirm-check-name="resend_report" data-confirm-check-hint="{% translate 'El informe de esta convocatoria ya se envió a los capitanes. Márcalo solo si ha cambiado algo que deban saber.' %}"{% elif past_match %} data-confirm-check="{% translate 'Enviar el informe por email' %}" data-confirm-check-name="resend_report" data-confirm-check-hint="{% translate 'La fecha del enfrentamiento ya pasó: por defecto no se envía el informe. Márcalo solo si lo necesitas.' %}"{% endif %}
              data-confirm="{% if phase.missing_players and not phase.blocked_by_min %}{% blocktranslate trimmed count n=phase.missing_players with called=phase.called total=phase.min_call %}Se va a cerrar la convocatoria con {{ n }} jugador menos del mínimo ({{ called }} de {{ total }}). Hazlo solo si hay bajas, por ejemplo por lesión.{% plural %}Se va a cerrar la convocatoria con {{ n }} jugadores menos del mínimo ({{ called }} de {{ total }}). Hazlo solo si hay bajas, por ejemplo por lesión.{% endblocktranslate %} {% endif %}{% blocktranslate count n=players_count %}Se cierra la convocatoria con {{ n }} convocado: ya no se podrá apuntar ni quitar a nadie.{% plural %}Se cierra la convocatoria con {{ n }} convocados: ya no se podrá apuntar ni quitar a nadie.{% endblocktranslate %} {% if report_already_sent and not finals_call_short %}{% translate 'El informe ya se envió a los capitanes: marca la casilla si quieres enviarlo otra vez.' %}{% elif past_match %}{% translate 'La fecha del enfrentamiento ya pasó: no se enviará el informe salvo que marques la casilla.' %}{% elif report_emails %}{% blocktranslate with emails=report_emails %}Se enviará el informe PDF a: {{ emails }}{% endblocktranslate %}{% else %}{% translate 'Ningún capitán tiene email: no se enviará el informe.' %}{% endif %}">
            {% csrf_token %}
            {% if phase.missing_players and not phase.blocked_by_min %}<input type="hidden" name="allow_short" value="1">{% endif %}
            {% if card %}<button type="submit" class="z-menu-card is-next"{% if phase.blocked_by_min %} disabled aria-describedby="next-hint"{% endif %}><i class="z-menu-ic fa-solid fa-lock" aria-hidden="true"></i><b>{% translate "Cerrar convocatoria" %}</b><small>{{ figure }} · {% translate "siguiente paso" %}</small></button>{% else %}<button type="submit" class="btn btn-primary"{% if phase.blocked_by_min %} disabled aria-describedby="next-hint"{% endif %}><i class="fa-solid fa-lock me-1" aria-hidden="true"></i> {% translate "Siguiente: Cerrar convocatoria" %}</button>{% endif %}
        </form>
