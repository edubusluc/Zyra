{% load static i18n %}
{% comment %}
Card de equipo (local o visitante) del formulario de partido. El <select> real cubre
toda la card, transparente: al pulsarla se abre el desplegable de equipos y
js/match-form.js actualiza el nombre y la foto.
{% endcomment %}
{% static 'zyra/team.svg' as default_photo %}
<div class="z-team-card-field{% if field.errors %} has-error{% endif %}">
    <label class="z-team-card" for="{{ field.id_for_label }}" data-team-card data-default-photo="{{ default_photo }}">
        <span class="z-team-card-logo">
            <img src="{% if team.photo %}{{ team.photo.url }}{% else %}{{ default_photo }}{% endif %}" alt="" data-team-photo>
        </span>
        <span class="z-team-card-text">
            <span class="z-team-card-role">{{ field.label }}</span>
            <span class="z-team-card-name{% if not team %} is-empty{% endif %}" data-team-name>{% if team %}{{ team.name }}{% else %}{% translate "Elige equipo" %}{% endif %}</span>
        </span>
        <i class="fa-solid fa-chevron-down z-team-card-caret" aria-hidden="true"></i>
        {{ field }}
    </label>
    {% for error in field.errors %}<div class="alert-message">{{ error }}</div>{% endfor %}
</div>
