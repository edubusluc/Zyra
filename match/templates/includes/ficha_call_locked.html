{% load i18n %}
{# Con resultados guardados «Editar convocatoria» no abre la edición: un popup dice qué partidos hay que vaciar antes. Sin JS el GET lleva a edit_call, que avisa y vuelve. #}
<form action="{% url 'edit_call' call_for_match.public_id %}" method="get" data-confirm-info data-confirm-title="{% translate 'Hay resultados puestos' %}" data-confirm-action="{% translate 'Entendido' %}"
      data-confirm="{% blocktranslate trimmed with games=results_games_label %}Para modificar la convocatoria tienes que borrar antes el resultado de los partidos que ya lo tienen: {{ games }}. Puedes hacerlo con el botón «Borrar resultado» de cada partido.{% endblocktranslate %}">
    {% if card %}<button type="submit" class="z-menu-card{% if c.state == 'done' %} is-done{% elif c.state == 'cur' %} is-next{% endif %}"><i class="z-menu-ic fa-solid {% if c.state == 'done' %}fa-circle-check{% else %}fa-users{% endif %}" aria-hidden="true"></i><b>{{ c.label }}</b><small>{{ c.figure }}{% if c.state == 'cur' %} · {% translate "siguiente paso" %}{% endif %}{% if c.state == 'done' %}<span class="visually-hidden"> ({% translate "hecho" %})</span>{% endif %}</small></button>
    {% else %}<button type="submit"><i class="fa-solid fa-pen" aria-hidden="true"></i> {% translate "Editar convocatoria" %}</button>{% endif %}
</form>
