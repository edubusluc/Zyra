{% load i18n %}
{# Formulario de cerrar el acta; con card=True el botón es una tarjeta de acción. #}
<form method="POST" action="{% url 'close_match' match.public_id %}"
              data-confirm-title="{% translate 'Cerrar el acta' %}" data-confirm-action="{% translate 'Cerrar acta' %}"
              data-confirm="{% blocktranslate with local=match.local_name visiting=match.visiting_name date=match.start_date|date:'D j M Y' %}{{ local }} – {{ visiting }}, {{ date }}. Después no se podrán cambiar parejas ni resultados salvo que la reabras.{% endblocktranslate %}{% if is_future %} {% translate "La fecha es futura: comprueba que es el enfrentamiento correcto." %}{% endif %}" {% if match.reopened_at %}data-confirm-check="{% translate 'Volver a enviar el correo con los resultados' %}" data-confirm-check-name="resend_email" data-confirm-check-hint="{% translate 'El acta ya se cerró antes y el correo ya se envió. Si no lo marcas, no se enviará otro.' %}" {% elif old_match %}data-confirm-check="{% translate 'Enviar el correo con los resultados' %}" data-confirm-check-name="resend_email" data-confirm-check-hint="{% translate 'Es un enfrentamiento antiguo: por defecto no se avisa del resultado por correo. Márcalo solo si quieres avisar al club.' %}" {% endif %}data-loading-text="{% translate 'Cerrando el acta…' %}">
            {% csrf_token %}
            {% if is_future %}<input type="hidden" name="confirm_future" value="1">{% endif %}
            {% if card %}<button type="submit" class="z-menu-card is-next"><i class="z-menu-ic fa-solid fa-flag-checkered" aria-hidden="true"></i><b>{% translate "Cerrar acta" %}</b><small>{{ figure }} · {% translate "siguiente paso" %}</small></button>{% else %}<button type="submit" class="btn btn-primary"><i class="fa-solid fa-flag-checkered me-1" aria-hidden="true"></i> {% translate "Siguiente: Cerrar acta" %}</button>{% endif %}
        </form>
