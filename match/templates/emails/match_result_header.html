{% load i18n %}<td align="center" style="background-color:{{ band }}; padding:28px 32px 26px; text-align:center; font-family:Arial, Helvetica, sans-serif;">
      <span style="display:inline-block; border:1px {% if friendly %}dashed{% else %}solid{% endif %} {{ accent }}; color:{{ accent }}; font-size:11px; letter-spacing:2px; font-weight:bold; padding:4px 10px; border-radius:999px;">{{ tag }}</span>
      <div style="font-family:Syncopate, Archivo, Arial, Helvetica, sans-serif; font-style:italic; font-weight:bold; font-size:44px; letter-spacing:2px; color:{{ accent }}; margin:18px 0 6px; line-height:1.1;">{{ score }}</div>
      <div style="font-size:12px; letter-spacing:3px; color:#D8D9D3; text-transform:uppercase; font-weight:bold;">{{ label }} · {{ club }}</div>
      <div style="font-size:13px; color:#A4A79E; margin-top:8px;">{{ rival }} · {{ date }}</div>
    </td>
