{% load i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}<html lang="{{ LANGUAGE_CODE }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F2F2F2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F2F2F2;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#FFFFFF; border-radius:12px; overflow:hidden;">
        {% if header %}<tr>{{ header }}</tr>{% endif %}
        <tr>
          <td style="padding:28px 32px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.55; color:#1A1A1A;">
            {{ content }}
          </td>
        </tr>
        <tr>
          <td style="background-color:#ECECE6; padding:22px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" style="padding-right:14px;">
                  <img src="cid:{{ logo_cid }}" width="44" height="44" alt="Zyra" style="display:block; border:0;">
                </td>
                <td valign="middle" style="font-family:Arial, Helvetica, sans-serif; color:#1A1A1A;">
                  <div style="font-family:Syncopate, Archivo, Arial, Helvetica, sans-serif; font-style:italic; font-size:18px; font-weight:bold; letter-spacing:4px; color:#14532D;">ZYRA</div>
                  <div style="font-size:12px; color:#4A4D45;">{% translate "Gestión de equipos de pádel" %}</div>
                </td>
              </tr>
            </table>
            <p style="margin:14px 0 0; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.5; color:#4A4D45;">
              {% translate "Contacto:" %} <a href="mailto:{{ contact }}" style="color:#14532D; text-decoration:underline;">{{ contact }}</a>{% if site_url %}<br>
              <a href="{{ site_url }}" style="color:#14532D; text-decoration:underline;">{% translate "Hecho con Zyra" %}</a> · {{ site_url }}{% endif %}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
