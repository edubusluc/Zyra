{% load i18n %}
{% if impersonator %}
<div class="alert alert-warning rounded-0 mb-0 d-flex flex-wrap gap-2 align-items-center justify-content-center" role="status" style="position: sticky; top: 0; z-index: 2000;">
    <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
    <span>{% blocktranslate trimmed with username=user.get_username %}Editando como <strong>{{ username }}</strong>: lo que cambies queda anotado a tu nombre.{% endblocktranslate %}</span>
    <form method="post" action="{% url 'backoffice:impersonate_stop' %}" class="m-0" data-loading-text="{% translate 'Saliendo del modo «Entrar como»…' %}">
        {% csrf_token %}
        <button class="btn btn-sm btn-dark" type="submit">{% translate "Salir" %}</button>
    </form>
</div>
{% endif %}
