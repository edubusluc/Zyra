{% load i18n %}
{% if impersonator %}
<div class="alert alert-warning rounded-0 mb-0 d-flex flex-wrap gap-2 align-items-center justify-content-center" role="status" style="position: sticky; top: 0; z-index: 2000;">
    <i class="fa-solid fa-eye" aria-hidden="true"></i>
    <span>{% blocktranslate trimmed with username=user.get_username %}Estás viendo Zyra como <strong>{{ username }}</strong> (solo lectura, queda anotado).{% endblocktranslate %}</span>
    <form method="post" action="{% url 'backoffice:impersonate_stop' %}" class="m-0">
        {% csrf_token %}
        <button class="btn btn-sm btn-dark" type="submit">{% translate "Salir" %}</button>
    </form>
</div>
{% endif %}
